# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
---
on:
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: "Target Cluster"
        autoselect: true

      benchmark_config:
        type: group
        label: "Benchmark Configuration"
        items:
          duration:
            type: number
            label: "Test Duration (seconds)"
            default: 10
            min: 5
            max: 60
          run_cpu:
            type: boolean
            label: "Run CPU Benchmark"
            default: true
          run_memory:
            type: boolean
            label: "Run Memory Benchmark"
            default: true
          run_disk:
            type: boolean
            label: "Run Disk I/O Benchmark"
            default: true

      submit_to_scheduler:
        type: boolean
        label: Submit to Job Scheduler
        tooltip: Enable to submit job via SLURM or PBS scheduler (detected automatically from resource). Disable for direct SSH execution.
        default: false
        hidden: ${{ inputs.resource.schedulerType != 'slurm' && inputs.resource.schedulerType != 'pbs' }}

      slurm:
        type: group
        label: SLURM Configuration
        hidden: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}
        collapsed: true
        items:
          is_disabled:
            type: boolean
            default: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}
            hidden: true

          account:
            label: Account
            type: slurm-accounts
            resource: ${{ inputs.resource }}
            tooltip: SLURM account for job submission (--account)
            optional: true
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

          partition:
            type: slurm-partitions
            label: Partition
            optional: true
            resource: ${{ inputs.resource }}
            tooltip: Partition for job submission (--partition)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

          qos:
            label: Quality of Service (QoS)
            type: slurm-qos
            resource: ${{ inputs.resource }}
            tooltip: SLURM QoS setting (--qos)
            optional: true
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

          cpus_per_task:
            type: number
            label: CPUs per Task
            min: 1
            max: 256
            default: 1
            tooltip: Number of CPUs for the job (--cpus-per-task)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

          time:
            label: Walltime
            type: string
            default: 04:00:00
            tooltip: Maximum job duration, e.g., 04:00:00 (--time)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

          gres:
            label: GPUs (gres)
            type: dropdown
            default: ""
            optional: true
            tooltip: GPU resource specification (--gres). Leave empty for CPU-only jobs.
            options:
              - value: ""
                label: "No GPU (CPU only)"
              - value: "gpu:1"
                label: "1 GPU (gpu:1)"
              - value: "gpu:2"
                label: "2 GPUs (gpu:2)"
              - value: "gpu:4"
                label: "4 GPUs (gpu:4)"
              - value: "gpu:8"
                label: "8 GPUs (gpu:8)"
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

          scheduler_directives:
            type: editor
            label: Additional Directives
            optional: true
            tooltip: Additional SLURM directives (include #SBATCH prefix)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

      pbs:
        type: group
        label: PBS Configuration
        hidden: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}
        collapsed: true
        items:
          is_disabled:
            type: boolean
            default: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}
            hidden: true

          account:
            label: Account
            type: string
            optional: true
            tooltip: PBS account for job submission (-A)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}

          queue:
            label: Queue
            type: string
            optional: true
            tooltip: PBS queue name (-q)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}

          walltime:
            label: Walltime
            type: string
            default: 04:00:00
            tooltip: Maximum job duration, e.g., 04:00:00 (-l walltime=)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}

          select:
            label: Resource Selection
            type: string
            default: "1:ncpus=8:ngpus=1"
            placeholder: "1:ncpus=8:ngpus=1"
            tooltip: PBS resource selection string, e.g., 1:ncpus=8:ngpus=1 (-l select=)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}

          scheduler_directives:
            label: Additional Directives
            type: editor
            tooltip: Additional PBS directives (include #PBS prefix)
            optional: true
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}

sessions:
  results:
    type: tunnel
    redirect: true

permissions:
  - "*"

jobs:
  run-benchmarks:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout benchmark scripts
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/activate-benchmark.git
          branch: main

      - name: Run benchmarks via job_runner
        uses: marketplace/job_runner/v4.0
        with:
          resource: ${{ inputs.resource.ip }}
          scheduler: ${{ inputs.submit_to_scheduler }}
          inject_markers: true
          poll_interval: 10

          # SLURM options (ignored if not SLURM)
          partition: ${{ inputs.slurm.partition }}
          account: ${{ inputs.slurm.account }}
          qos: ${{ inputs.slurm.qos }}
          time: ${{ inputs.slurm.time }}
          cpus_per_task: ${{ inputs.slurm.cpus_per_task }}
          gres: ${{ inputs.slurm.gres }}
          scheduler_directives: ${{ inputs.slurm.scheduler_directives }}

          # PBS options (ignored if not PBS)
          queue: ${{ inputs.pbs.queue }}
          walltime: ${{ inputs.pbs.walltime }}
          select: ${{ inputs.pbs.select }}
          pbs_account: ${{ inputs.pbs.account }}
          pbs_scheduler_directives: ${{ inputs.pbs.scheduler_directives }}

          use_existing_script: false
          script: |
            #!/bin/bash
            set -e

            # Set environment variables for benchmark
            export DURATION=${{ inputs.benchmark_config.duration }}
            export RUN_CPU=${{ inputs.benchmark_config.run_cpu }}
            export RUN_MEMORY=${{ inputs.benchmark_config.run_memory }}
            export RUN_DISK=${{ inputs.benchmark_config.run_disk }}

            echo "=== Running Single Node Benchmark ==="
            echo "Duration: ${DURATION}s"
            echo "CPU: ${RUN_CPU}, Memory: ${RUN_MEMORY}, Disk: ${RUN_DISK}"
            echo "Hostname: $(hostname)"
            echo ""

            # Run the benchmark script
            bash scripts/run_benchmarks.sh

            echo ""
            echo "=== Benchmark Complete ==="

            # Copy results to a known location for retrieval
            RESULTS_DIR="${HOME}/benchmark_results_${PW_JOB_ID}"
            mkdir -p "${RESULTS_DIR}"
            cp -r ./results/* "${RESULTS_DIR}/" 2>/dev/null || true
            echo "Results saved to: ${RESULTS_DIR}"

  visualize_results:
    needs: [run-benchmarks]
    # Run on user workspace (no SSH) - works regardless of cluster type
    steps:
      - name: Setup visualization environment
        run: |
          # Create venv if it doesn't exist
          if [ ! -d ~/venv ]; then
            python3 -m venv ~/venv
          fi
          source ~/venv/bin/activate

          # Install dependencies
          pip install plotly

      - name: Copy results from cluster
        run: |
          RESULTS_DIR="${HOME}/benchmark_results_${PW_JOB_ID}"
          mkdir -p ./results

          # Copy results from the cluster
          scp -r ${{ inputs.resource.user }}@${{ inputs.resource.ip }}:${RESULTS_DIR}/* ./results/ || echo "Warning: Could not copy results"

          echo "RESULTS_COPIED=true" >> $OUTPUTS

      - name: Generate visualization
        run: |
          source ~/venv/bin/activate

          # Kill any existing process on port 8080
          if lsof -ti:8080 > /dev/null 2>&1; then
            echo "Killing existing process on port 8080..."
            kill -9 $(lsof -ti:8080) 2>/dev/null || true
            sleep 1
          fi

          # Generate the visualization
          python3 scripts/generate_plot.py

          echo "HOSTNAME=$(hostname)" >> $OUTPUTS
          echo "PORT=8080" >> $OUTPUTS

      - name: Update session
        uses: parallelworks/update-session
        with:
          target: user-workspace
          name: ${{ sessions.results }}
          remotePort: 8080

      - name: Serve results (blocking)
        run: |
          source ~/venv/bin/activate
          echo "Starting HTTP server on port 8080..."
          echo "Session is active. Cancel the workflow to stop."
          # Run server in foreground - this blocks and keeps session alive
          python3 scripts/serve_results.py
